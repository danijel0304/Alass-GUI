name: Build Windows EXE and Linux packages

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --icon assets/alass-gui.ico --name Alass-GUI alass_gui.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Alass-GUI-Windows-EXE
          path: dist/Alass-GUI.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y fuse libfuse2 wget
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set package version
        id: package
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux binary
        run: |
          mkdir -p packages
          chmod +x bin/alass || true
          pyinstaller --onefile --windowed --name alass-gui alass_gui.py

      - name: Build TAR.GZ package
        run: |
          tar -czf packages/Alass-GUI-linux-x86_64.tar.gz -C dist alass-gui

      - name: Build DEB package
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/scalable/apps

          cp dist/alass-gui package/usr/bin/alass-gui
          chmod +x package/usr/bin/alass-gui
          cp assets/alass-gui.svg package/usr/share/icons/hicolor/scalable/apps/alass-gui.svg

          cat > package/DEBIAN/control <<EOF
          Package: alass-gui
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Danijel
          Description: Graphical interface for alass subtitle synchronization tool
          EOF

          cat > package/usr/share/applications/alass-gui.desktop <<EOF
          [Desktop Entry]
          Name=Alass GUI
          Comment=Subtitle synchronization tool
          Exec=alass-gui
          Terminal=false
          Type=Application
          Icon=alass-gui
          Categories=Utility;
          EOF

          dpkg-deb --build package "packages/alass-gui_${VERSION}_amd64.deb"

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp dist/alass-gui AppDir/usr/bin/alass-gui
          chmod +x AppDir/usr/bin/alass-gui

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/alass-gui" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/alass-gui.desktop <<EOF
          [Desktop Entry]
          Name=Alass GUI
          Comment=Subtitle synchronization tool
          Exec=alass-gui
          Icon=alass-gui
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          cp AppDir/alass-gui.desktop AppDir/usr/share/applications/alass-gui.desktop
          cp assets/alass-gui.svg AppDir/alass-gui.svg
          cp assets/alass-gui.svg AppDir/usr/share/icons/hicolor/scalable/apps/alass-gui.svg

          wget -O appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool.AppImage AppDir packages/Alass-GUI-x86_64.AppImage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Alass-GUI-Linux-Packages
          path: |
            dist/alass-gui
            packages/*

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
